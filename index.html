  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

  <style>
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background-color: #fef9f3;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #004080;
      padding: 10px 0;
      text-align: center;
    }

    .sections {
      background-color: #fff0e6;
      padding: 20px;
      margin: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .sections ul {
      list-style: none;
      padding: 0;
      text-align: center;
    }

    .sections ul li {
      display: inline-block;
      margin: 0 15px;
    }

    .sections ul li a {
      text-decoration: none;
      color: #004080;
      font-weight: bold;
      font-size: 18px;
    }

    /* Author Banner Scroll */
    .author-marquee {
      overflow: hidden;
      background: #fffacd;
      border-top: 2px solid #e6b800;
      border-bottom: 2px solid #e6b800;
      padding: 10px 0;
    }

    .author-track {
      display: inline-block;
      white-space: nowrap;
      animation: scroll-left 15s linear infinite;
    }

    .author-track span {
      font-size: 18px;
      color: #b30000;
      font-weight: bold;
      padding-left: 100%;
    }

    .author-track a {
      color: #b30000;
      text-decoration: underline;
      font-weight: bold;
    }

    @keyframes scroll-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Swiper Gallery */
    .swiper {
      width: 70%;
      height: 85vh;
      margin-top: 30px;
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {
      width: 60%;
      height: 75vh;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    /* Fullscreen Preview */
    #fullscreenImage {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #fullscreenImage img {
      max-width: 70%;
      max-height: 70%;
      border-radius: 10px;
    }

    /* Floating YouTube Button */
    .youtube-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: red;
      color: white;
      padding: 10px 15px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }
  </style>
</head>

    📺 YouTube
  </a>

  <!-- Swiper JS -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

  <!-- Image Fullscreen JS -->
  <script>
    const swiper = new Swiper(".mySwiper", {
      slidesPerView: 1, // Show 1 image only
      spaceBetween: 30,
      loop: true,
      autoplay: {
        delay: 4000,
        disableOnInteraction: false,
      }
    });

    // Double tap or click to view fullscreen
    const images = document.querySelectorAll('.swiper-slide img');
    let lastTap = 0;

    images.forEach(img => {
      img.addEventListener('dblclick', () => {
        showFullscreen(img.src);
      });

      img.addEventListener('touchstart', e => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          showFullscreen(img.src);
          e.preventDefault();
        }
        lastTap = currentTime;
      });
    });

    function showFullscreen(src) {
      document.getElementById('fullscreenImg').src = src;
      document.getElementById('fullscreenImage').style.display = 'flex';
    }
  </script>
