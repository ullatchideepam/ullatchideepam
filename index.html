<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <title>உள்ளாட்சி தீபம்</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

  <style>
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background-color: #fef9f3;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #004080;
      padding: 10px 0;
      text-align: center;
    }

    .logo {
      max-width: 250px;
      border-radius: 8px;
    }

    .sections {
      background-color: #fff0e6;
      padding: 20px;
      margin: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .sections h2 {
      color: #e6005c;
      font-size: 26px;
      text-align: center;
      margin-bottom: 15px;
    }

    .sections ul {
      list-style: none;
      padding: 0;
      text-align: center;
    }

    .sections ul li {
      display: inline-block;
      margin: 0 15px;
    }

    .sections ul li a {
      text-decoration: none;
      color: #004080;
      font-weight: bold;
      font-size: 18px;
    }

    /* 🧑‍💻 Author Banner - Small, text only */
    .author-marquee {
      background: #fffacd;
      padding: 10px 15px;
      text-align: center;
      border-top: 2px solid #e6b800;
      border-bottom: 2px solid #e6b800;
      font-size: 16px;
      color: #b30000;
      font-weight: bold;
      line-height: 1.4;
    }

    /* Swiper Styles */
    .swiper {
      width: 100%;
      height: 90vh;
      margin-top: 30px;
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {
      width: 90%;
      height: 80vh;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    /* Fullscreen Preview */
    #fullscreenImage {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #fullscreenImage img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

  </style>
</head>
<body>

  <!-- 🔷 Logo Header -->
  <header>
    <img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/ullatchideepam.jpg"
         alt="Ullatchideepam Logo"
         style="width: 100%; height: auto; border-radius: 9px;">
  </header>

  <!-- 🧑‍💻 Author Banner (Small Text Only) -->
  <div class="author-marquee">
    ✍️ இரா. அய்யப்பன் – ஆசிரியர்<br>
    தொடர்புக்கு: 94899 19194
  </div>

  <!-- 🔗 Section Navigation -->
  <section class="sections">
    <ul>
      <li><a href="#">GALLERY</a></li>
      <li><a href="seidhigal.html">நேரலை செய்திகள்</a></li>
      <li><a href="tamilnadu.html">தமிழ்நாடு</a></li>
      <li><a href="tech.html">தொழில்நுட்பம்</a></li>
      <li><a href="vilaiyaattu.html">விளையாட்டு</a></li>
      <li><a href="idhal.html">Magazine</a></li>
      <li><a href="contact.html">தொடர்புக்கு</a></li>
    </ul>
  </section>

  <!-- 📸 Swiper Image Slider -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/01.jpg" alt="01"></div>
      <div class="swiper-slide"><img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/02.jpg" alt="02"></div>
      <div class="swiper-slide"><img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/03.jpg" alt="03"></div>
      <div class="swiper-slide"><img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/04.jpg" alt="04"></div>
      <div class="swiper-slide"><img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/05.jpg" alt="05"></div>
      <div class="swiper-slide"><img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/1.jpg" alt="1"></div>
      <div class="swiper-slide"><img src="https://raw.githubusercontent.com/ullatchideepam/ullatchideepam/main/2.jpg" alt="2"></div>
    </div>
  </div>

  <!-- 🔍 Fullscreen Zoomed View -->
  <div id="fullscreenImage" onclick="this.style.display='none'">
    <img id="fullscreenImg" src="" alt="Full Image" />
  </div>

  <!-- Swiper JS -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

  <!-- JS Logic -->
  <script>
    const swiper = new Swiper(".mySwiper", {
      slidesPerView: 2,
      spaceBetween: 30,
      loop: true,
      autoplay: {
        delay: 4000,
        disableOnInteraction: false,
      }
    });

    // Double click or tap to enlarge
    const images = document.querySelectorAll('.swiper-slide img');
    let lastTap = 0;

    images.forEach(img => {
      img.addEventListener('dblclick', () => {
        showFullscreen(img.src);
      });

      img.addEventListener('touchstart', e => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          showFullscreen(img.src);
          e.preventDefault();
        }
        lastTap = currentTime;
      });
    });

    function showFullscreen(src) {
      document.getElementById('fullscreenImg').src = src;
      document.getElementById('fullscreenImage').style.display = 'flex';
    }
  </script>

</body>
</html>
